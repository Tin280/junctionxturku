services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma4:31b-cloud"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: https://ollama.com
      OLLAMA_MODEL: gemma4:31b-cloud
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      TIMEZONE: Europe/Helsinki
    volumes:
      - ./backend/src:/app/backend/src
      - ./mcp-ryhti/src:/app/mcp-ryhti/src
volumes:
    ollama_data: